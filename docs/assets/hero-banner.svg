<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none">
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FAFAFF"/>
      <stop offset="100%" stop-color="#F5F7FF"/>
    </linearGradient>
    <radialGradient id="glow-tl" cx="0.12" cy="0.15" r="0.45">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-br" cx="0.88" cy="0.85" r="0.45">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid-light" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#E2E8F0" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
    <filter id="card-shadow" x="-8%" y="-10%" width="116%" height="126%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Outer White Frame -->
  <rect x="2" y="2" width="1196" height="316" rx="20" fill="url(#bg-light)" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="316" rx="20" fill="url(#grid-light)"/>
  <rect x="2" y="2" width="1196" height="316" rx="20" fill="url(#glow-tl)"/>
  <rect x="2" y="2" width="1196" height="316" rx="20" fill="url(#glow-br)"/>

  <!-- Left Column: Brand Mark + Status Badge -->
  <g transform="translate(56, 44)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#brand-grad)"/>
    <path d="M17 12h12l7 7v16a2 2 0 0 1-2 2H17a2 2 0 0 1-2-2V14a2 2 0 0 1 2-2Z" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-width="2.2"/>
    <path d="M29 12v7h7" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M20 25h11M20 30h8" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

    <rect x="68" y="11" width="296" height="30" rx="15" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <circle cx="84" cy="26" r="4" fill="#10B981"/>
    <text x="96" y="30" fill="#4338CA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4">PRIVACY-FIRST DOCUMENT WORKSPACE</text>
  </g>

  <!-- Main Heading & Two-Line Non-Overlapping Subtitle -->
  <text x="56" y="148" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.2">DocuMind AI</text>
  <text x="56" y="184" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
    Exact-KB PDF toolkit, exam photo resizer &amp; camera scan
  </text>
  <text x="56" y="210" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
    with immutable versioning and bilingual UI (EN + தமிழ்).
  </text>

  <!-- Bottom Feature Pills (Guaranteed within x=56..688) -->
  <g transform="translate(56, 238)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">
    <rect x="0" y="0" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="16" cy="17" r="4" fill="#6366F1"/>
    <text x="28" y="21" fill="#1E293B">Immutable v1 → vN</text>

    <rect x="160" y="0" width="154" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="176" cy="17" r="4" fill="#10B981"/>
    <text x="188" y="21" fill="#1E293B">Exact-KB Targets</text>

    <rect x="324" y="0" width="162" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="340" cy="17" r="4" fill="#0284C7"/>
    <text x="352" y="21" fill="#1E293B">1h Guest Auto-Purge</text>

    <rect x="496" y="0" width="136" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="512" cy="17" r="4" fill="#8B5CF6"/>
    <text x="524" y="21" fill="#1E293B">AGPL-Isolated</text>
  </g>

  <!-- Right Column: Crisp White Pipeline Card (x=756..1144, y=44..276) -->
  <g transform="translate(756, 44)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="388" height="232" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Card Titlebar -->
    <path d="M 1 14 Q 1 1 14 1 L 374 1 Q 387 1 387 14 L 387 36 L 1 36 Z" fill="#F8FAFC"/>
    <line x1="0" y1="36" x2="388" y2="36" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#F87171"/>
    <circle cx="36" cy="18" r="4.5" fill="#FBBF24"/>
    <circle cx="52" cy="18" r="4.5" fill="#34D399"/>
    <text x="72" y="22" fill="#64748B" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="500">documind / pipeline</text>

    <!-- Pipeline Rows -->
    <g transform="translate(18, 50)" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <!-- Row 1 -->
      <rect x="0" y="0" width="352" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect x="10" y="9" width="20" height="20" rx="5" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text x="16.5" y="23" fill="#4F46E5" font-size="11" font-weight="700">1</text>
      <text x="40" y="23" fill="#1E293B" font-weight="500">Magic-Byte + ClamAV Scan</text>
      <rect x="292" y="9" width="48" height="20" rx="5" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="316" y="23" text-anchor="middle" fill="#047857" font-size="10.5" font-weight="700">PASS</text>

      <!-- Row 2 -->
      <rect x="0" y="46" width="352" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect x="10" y="55" width="20" height="20" rx="5" fill="#F5F3FF" stroke="#DDD6FE"/>
      <text x="20" y="69" text-anchor="middle" fill="#7C3AED" font-size="11" font-weight="700">2</text>
      <text x="40" y="69" fill="#1E293B" font-weight="500">JS Strip + SHA-256 v1</text>
      <rect x="292" y="55" width="48" height="20" rx="5" fill="#F0F9FF" stroke="#BAE6FD"/>
      <text x="316" y="69" text-anchor="middle" fill="#0369A1" font-size="10.5" font-weight="700">SAFE</text>

      <!-- Row 3 -->
      <rect x="0" y="92" width="352" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect x="10" y="101" width="20" height="20" rx="5" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="20" y="115" text-anchor="middle" fill="#059669" font-size="11" font-weight="700">3</text>
      <text x="40" y="115" fill="#1E293B" font-weight="500">Approve Plan → Worker</text>
      <rect x="292" y="101" width="48" height="20" rx="5" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text x="316" y="115" text-anchor="middle" fill="#4338CA" font-size="10.5" font-weight="700">v2</text>

      <!-- Footer Strip -->
      <rect x="0" y="140" width="352" height="26" rx="6" fill="#F1F5F9"/>
      <text x="14" y="157" fill="#64748B" font-size="11" font-weight="500">Next.js 15 • FastAPI • Celery • pgvector</text>
    </g>
  </g>
</svg>
