[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/alembic/versions/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests"]
pythonpath = [".", "../../services/document-worker"]

[tool.coverage.run]
concurrency = ["thread", "greenlet"]
